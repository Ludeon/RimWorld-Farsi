name: 'Setup Python Environment'
description: 'Sets up Python with uv package manager and optimized caching'
inputs:
  python-version:
    description: 'Python version to setup'
    required: true
    default: '3.13'

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.6.14"
        enable-cache: false

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install base dependencies
      shell: bash
      run: |
        uv pip install --system lxml pytest pytest-cov mypy ruff pip-audit

    - name: Verify setup
      shell: bash
      run: |
        echo "✅ Python Environment Setup Complete"
        python --version
        uv --version
        pip list --local
