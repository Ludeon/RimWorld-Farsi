name: 'Setup Python Environment'
description: 'Sets up Python with uv package manager and optimized caching'
inputs:
  python-version:
    description: 'Python version to setup'
    required: true
    default: '3.13'

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        version: "0.6.14"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          tools/rtl-processor/requirements.txt

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install base dependencies
      shell: bash
      run: |
        uv pip install --system lxml pytest pytest-cov mypy ruff pip-audit

    - name: Verify setup
      shell: bash
      run: |
        echo "✅ Python Environment Setup Complete"
        python --version
        uv --version
        pip list --local
