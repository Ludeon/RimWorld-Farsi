name: Steam Workshop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog / Release Notes for Steam Workshop'
        required: false
        default: 'Automated translation update and runtime engine improvements.'
        type: string
      dry_run:
        description: 'Dry run (verify and package without publishing to Steam)'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: steam-workshop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Prepare & Verify Workshop Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install QA & Processing Dependencies
        run: |
          pip install --upgrade pip
          pip install lxml pytest ruff mypy

      - name: Run Full QA Linter Suite
        run: |
          python tools/qa/run_qa.py --github

      - name: Build and Test C# Harmony Assembly
        run: |
          dotnet build mods/RTL_Persian_Support/Source/RTL_Persian_Support.csproj -c Release -p:UseLocalManaged=false
          dotnet test mods/RTL_Persian_Support/Tests/RTL_Persian_Support.Tests.csproj -c Release
          test -f mods/RTL_Persian_Support/Assemblies/RTL_Persian_Support.dll
          test -f mods/RTL_Persian_Support/Assemblies/0Harmony.dll

      - name: Assemble Steam Workshop Content
        run: |
          # Create clean staging directory
          STAGING_DIR="build/steam_workshop/danial.rtlpersiansupport"
          mkdir -p "$STAGING_DIR"

          # 1. Copy Mod Core (About, Assemblies, Fonts, Resources)
          cp -r mods/RTL_Persian_Support/About "$STAGING_DIR/"
          cp -r mods/RTL_Persian_Support/Assemblies "$STAGING_DIR/"
          cp -r mods/RTL_Persian_Support/Resources "$STAGING_DIR/"
          cp mods/RTL_Persian_Support/*.ttf "$STAGING_DIR/" 2>/dev/null || true
          cp mods/RTL_Persian_Support/README.txt "$STAGING_DIR/" 2>/dev/null || true

          # 2. Package Languages into mod structure (Essential: Persian DefInjected/Keyed + English Strings/)
          mkdir -p "$STAGING_DIR/Languages/Persian (فارسی)"
          
          [ -d "Core/DefInjected" ] && cp -r Core/DefInjected "$STAGING_DIR/Languages/Persian (فارسی)/"
          [ -d "Core/Keyed" ] && cp -r Core/Keyed "$STAGING_DIR/Languages/Persian (فارسی)/"
          [ -d "Core/WordInfo" ] && cp -r Core/WordInfo "$STAGING_DIR/Languages/Persian (فارسی)/"
          [ -f "Core/LanguageInfo.xml" ] && cp Core/LanguageInfo.xml "$STAGING_DIR/Languages/Persian (فارسی)/"
          [ -d "src/english/Core/Strings" ] && cp -r src/english/Core/Strings "$STAGING_DIR/Languages/Persian (فارسی)/"

          # Copy DLC translations if present
          for DLC in Royalty Ideology Biotech Anomaly Odyssey; do
            if [ -d "$DLC" ]; then
              mkdir -p "$STAGING_DIR/$DLC/Languages/Persian (فارسی)"
              [ -d "$DLC/DefInjected" ] && cp -r "$DLC/DefInjected" "$STAGING_DIR/$DLC/Languages/Persian (فارسی)/"
              [ -d "$DLC/Keyed" ] && cp -r "$DLC/Keyed" "$STAGING_DIR/$DLC/Languages/Persian (فارسی)/"
              [ -d "$DLC/WordInfo" ] && cp -r "$DLC/WordInfo" "$STAGING_DIR/$DLC/Languages/Persian (فارسی)/"
              [ -f "$DLC/LanguageInfo.xml" ] && cp "$DLC/LanguageInfo.xml" "$STAGING_DIR/$DLC/Languages/Persian (فارسی)/"
              [ -d "src/english/$DLC/Strings" ] && cp -r "src/english/$DLC/Strings" "$STAGING_DIR/$DLC/Languages/Persian (فارسی)/"
            fi
          done

          echo "Workshop content staged successfully at $STAGING_DIR"
          ls -la "$STAGING_DIR"

      - name: Verify Staged Workshop Structure
        run: |
          STAGING_DIR="build/steam_workshop/danial.rtlpersiansupport"
          test -f "$STAGING_DIR/About/About.xml" || { echo "Missing About/About.xml"; exit 1; }
          test -f "$STAGING_DIR/About/Manifest.xml" || { echo "Missing About/Manifest.xml"; exit 1; }
          test -f "$STAGING_DIR/Assemblies/RTL_Persian_Support.dll" || { echo "Missing compiled DLL"; exit 1; }
          test -f "$STAGING_DIR/Vazirmatn.ttf" || { echo "Missing Vazirmatn.ttf"; exit 1; }
          echo "All structural checks passed."

      - name: Archive Workshop Package
        run: |
          cd build/steam_workshop
          zip -r ../../rimworld-persian-workshop.zip danial.rtlpersiansupport/

      - name: Upload Workshop Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rimworld-persian-steam-workshop
          path: rimworld-persian-workshop.zip
          retention-days: 14

  deploy-steam-workshop:
    name: Deploy to Steam Workshop
    runs-on: ubuntu-latest
    needs: validate-and-package
    if: github.event.inputs.dry_run != 'true'
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download Workshop Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rimworld-persian-steam-workshop
          path: ./

      - name: Extract Staged Workshop Package
        run: |
          unzip -q rimworld-persian-workshop.zip -d ./staged

      - name: Check Steam Credentials
        id: check_creds
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_WORKSHOP_ID: ${{ secrets.STEAM_WORKSHOP_ID }}
        run: |
          if [ -n "$STEAM_USERNAME" ] && [ -n "$STEAM_CONFIG_VDF" ] && [ -n "$STEAM_WORKSHOP_ID" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "Steam credentials detected in secrets."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::Steam credentials (STEAM_USERNAME, STEAM_CONFIG_VDF, STEAM_WORKSHOP_ID) not found. Skipping live upload."
          fi

      - name: Deploy via SteamCMD
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: game-ci/steam-deploy@1c487ecde10efac6b6630e38978187c09497c427 # v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 294100
          buildDescription: ${{ github.event.inputs.changelog || github.event.release.name || 'Automated Persian Translation Release' }}
          rootPath: ./staged/danial.rtlpersiansupport
          workshopId: ${{ secrets.STEAM_WORKSHOP_ID }}
