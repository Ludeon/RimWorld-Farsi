name: PR CI Validation Gate

on:
  pull_request:
    branches: [master, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-qa:
    name: Python Lint, Typecheck & Localization QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'

      - name: Lint and type-check all tools
        run: |
          ruff check tools/ --output-format=github
          mypy tools/ --show-error-codes

      - name: Run Python test suite with coverage
        run: |
          python -m pytest tools/rtl-processor/tests -v --cov=tools --cov-report=term-missing

      - name: Run RimWorld Persian 5-gate QA suite
        run: |
          python tools/qa/run_qa.py --github

      - name: Verify shell installer syntax
        run: |
          bash -n install.sh

  csharp-mod:
    name: Build & Test RTL_Persian_Support (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Build RTL_Persian_Support against RimWorld 1.6 ref assemblies
        run: |
          dotnet build mods/RTL_Persian_Support/Source/RTL_Persian_Support.csproj -c Release -p:UseLocalManaged=false

      - name: Run C# core RTL & BiDi unit tests
        run: |
          dotnet test mods/RTL_Persian_Support/Tests/RTL_Persian_Support.Tests.csproj -c Release --verbosity normal
