name: Reusable Testing Pipeline

on:
  workflow_call:
    inputs:
      python_versions:
        description: 'JSON array of Python versions to test'
        type: string
        default: '["3.11", "3.12", "3.13"]'
      enable_benchmarks:
        description: 'Enable performance benchmarking'
        type: boolean
        default: false
      skip_qa:
        description: 'Skip quality assurance checks'
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

env:
  TOOLS_DIR: tools/rtl-processor

jobs:
  test:
    name: Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install benchmark dependency
        if: inputs.enable_benchmarks == true
        run: |
          uv pip install --system pytest-benchmark

      - name: Run security audit
        if: inputs.skip_qa != true
        run: |
          cd ${{ env.TOOLS_DIR }}
          pip-audit --format json | tee audit-results.json

      - name: Code quality checks across all tools
        if: inputs.skip_qa != true
        run: |
          ruff check tools/ --output-format=github
          mypy tools/ --show-error-codes

      - name: Run tests with coverage
        if: inputs.skip_qa != true
        run: |
          python -m pytest tools/rtl-processor/tests -v --tb=short --cov=tools --cov-report=xml --cov-report=term-missing --durations=10

      - name: Run RimWorld Persian Localization QA Suite
        if: inputs.skip_qa != true
        run: |
          python tools/qa/run_qa.py --github

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.13'
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Performance benchmark
        if: inputs.enable_benchmarks == true
        run: |
          cd ${{ env.TOOLS_DIR }}
          python -m pytest tests/ --benchmark-only --benchmark-json benchmark-results.json --benchmark-compare

      - name: Upload benchmark results
        if: inputs.enable_benchmarks == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ matrix.python-version }}
          path: ${{ env.TOOLS_DIR }}/benchmark-results.json
          retention-days: 7

      - name: Generate Test Report
        if: always()
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Version | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

          if [ -f "${{ env.TOOLS_DIR }}/coverage.xml" ]; then
            COVERAGE=$(python -c "import xml.etree.ElementTree as ET; root = ET.parse('${{ env.TOOLS_DIR }}/coverage.xml').getroot(); rate = float(root.attrib.get('line-rate', '0')); print(f'{rate * 100:.1f}')")
            echo "| Coverage | ${COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ inputs.enable_benchmarks }}" = "true" ] && [ -f "${{ env.TOOLS_DIR }}/benchmark-results.json" ]; then
            echo "| Benchmarks | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Ruff linting completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Black formatting verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ isort import sorting checked" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MyPy type checking passed" >> $GITHUB_STEP_SUMMARY
