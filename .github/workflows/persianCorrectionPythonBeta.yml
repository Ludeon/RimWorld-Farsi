name: Persian Translation CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'RTL-Tools-Python-Beta/**'
      - 'Persian/**'
      - '.github/workflows/persianCorrectionPythonBeta.yml'
  pull_request:
    branches: [main]
    paths:
      - 'RTL-Tools-Python-Beta/**'
      - 'Persian/**'
      - '.github/workflows/persianCorrectionPythonBeta.yml'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to use'
        required: false
        default: '3.13'
        type: choice
        options:
          - '3.11'
          - '3.12'
          - '3.13'
      enable_security_scan:
        description: 'Enable advanced security scanning'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Create a GitHub release after successful build'
        required: false
        default: false
        type: boolean
      enable_performance_benchmark:
        description: 'Run performance benchmarks'
        required: false
        default: false
        type: boolean
      enable_compliance_checks:
        description: 'Run compliance and license scanning'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.13' }}
  UV_CACHE_DIR: ~/.cache/uv
  BUILD_DIR: Persian
  TOOLS_DIR: RTL-Tools-Python-Beta

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write
  checks: write
  id-token: write
  attestations: write

jobs:
  security:
    name: Security & Dependency Analysis
    uses: ./.github/workflows/reusable-security.yml
    with:
      enable_compliance: ${{ github.event.inputs.enable_compliance_checks == 'true' }}
    secrets: inherit

  test:
    name: Quality Assurance
    uses: ./.github/workflows/reusable-testing.yml
    needs: security
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      enable_benchmarks: ${{ github.event.inputs.enable_performance_benchmark == 'true' }}
    secrets: inherit

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    outputs:
      module: ${{ matrix.module }}

    strategy:
      matrix:
        module: [Core, Biotech, Ideology, Royalty, Anomaly, Odyssey]
        include:
          - module: Core
            priority: 1
          - module: Biotech
            priority: 2
          - module: Ideology
            priority: 3
          - module: Royalty
            priority: 4
          - module: Anomaly
            priority: 5
          - module: Odyssey
            priority: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Process ${{ matrix.module }} translations
        id: translation
        run: |
          echo "🔄 Processing ${{ matrix.module }} translations..."
          cd ${{ env.TOOLS_DIR }}
          START_TIME=$(date +%s)

          # Process specific module if it exists
          if [ -d "../${{ env.BUILD_DIR }}/${{ matrix.module }}" ]; then
            python PersianFixer.py "../${{ env.BUILD_DIR }}/${{ matrix.module }}"
          else
            echo "Module ${{ matrix.module }} not found, skipping..."
          fi

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "translation_duration=$DURATION" >> $GITHUB_OUTPUT
          echo "✅ ${{ matrix.module }} translation processing completed in ${DURATION}s"

      - name: Validate ${{ matrix.module }} XML structure
        id: validation
        run: |
          echo "🔍 Validating ${{ matrix.module }} XML files..."
          cd ${{ env.TOOLS_DIR }}
          START_TIME=$(date +%s)

          if [ -d "../${{ env.BUILD_DIR }}/${{ matrix.module }}" ]; then
            python validate_xml.py "../${{ env.BUILD_DIR }}/${{ matrix.module }}"
          fi

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "validation_duration=$DURATION" >> $GITHUB_OUTPUT
          echo "✅ ${{ matrix.module }} XML validation completed in ${DURATION}s"

      - name: Upload module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-processed-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/${{ matrix.module }}/
          retention-days: 1
          if-no-files-found: warn

  merge-modules:
    name: Merge & Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
      build-id: ${{ steps.metadata.outputs.build-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all module artifacts
        uses: actions/download-artifact@v4
        with:
          path: modules/

      - name: Merge modules into final build
        run: |
          echo "🔀 Merging processed modules..."
          mkdir -p ${{ env.BUILD_DIR }}

          # Copy all processed modules
          for module_dir in modules/*-processed-${{ github.run_id }}/*/; do
            if [ -d "$module_dir" ]; then
              cp -r "$module_dir" ${{ env.BUILD_DIR }}/
            fi
          done

          echo "✅ Module merging completed"

      - name: Generate build metadata
        id: metadata
        run: |
          BUILD_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          # Calculate total durations from job outputs
          TOTAL_TRANSLATION=0
          TOTAL_VALIDATION=0

          # Create comprehensive build info
          cat > ${{ env.BUILD_DIR }}/build_info.json << EOF
          {
            "build_id": "$BUILD_ID",
            "commit": "${{ github.sha }}",
            "timestamp": "$TIMESTAMP",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "trigger": "${{ github.event_name }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "python_version": "${{ env.PYTHON_VERSION }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "parallel_processing": true,
            "modules_processed": ["Core", "Biotech", "Ideology", "Royalty", "Anomaly", "Odyssey"]
          }
          EOF

      - name: Create distribution package
        id: artifact
        run: |
          ARTIFACT_NAME="persian-language-${{ steps.metadata.outputs.build-id }}"
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

          # Create optimized ZIP
          cd ${{ env.BUILD_DIR }}
          zip -r "../$ARTIFACT_NAME.zip" . --compression-method deflate

          # Generate cryptographic hashes
          sha256sum "../$ARTIFACT_NAME.zip" > "../$ARTIFACT_NAME.zip.sha256"
          md5sum "../$ARTIFACT_NAME.zip" > "../$ARTIFACT_NAME.zip.md5"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.artifact.outputs.name }}.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.name }}.zip
            ${{ steps.artifact.outputs.name }}.zip.sha256
            ${{ steps.artifact.outputs.name }}.zip.md5
          retention-days: 30
          if-no-files-found: error

      - name: Generate enhanced job summary
        if: always()
        run: |
          echo "# 🚀 Persian Translation Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build ID | ${{ steps.metadata.outputs.build-id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | ${{ steps.metadata.outputs.timestamp }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Version | ${{ env.PYTHON_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Processing Mode | Parallel (6 modules) |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "| Artifacts | [View & Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Build Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ Security checks passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Quality assurance completed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Parallel translation processing successful" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ XML validation passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Build artifacts created and attested" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Build failed - review job logs for details" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Automated Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: merge-modules
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.merge-modules.outputs.artifact-name }}
          path: artifacts/

      - name: Determine next version
        id: version
        run: |
          # Get latest tag (remove 'v' prefix for parsing)
          LATEST_TAG=$(git tag --sort=-version:refname | head -1 | sed 's/^v//')
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            # Parse version and increment patch
            IFS='.' read -r major minor patch <<< "$LATEST_TAG"
            NEXT_VERSION="$major.$minor.$((patch + 1))"
          fi
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          VERSION=${{ steps.version.outputs.next_version }}
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts with Sigstore
        run: |
          cd artifacts
          for file in *.zip; do
            cosign sign-blob --oidc-issuer https://token.actions.githubusercontent.com --yes "$file" > "$file.sig"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.next_version }}
          name: Persian Language Pack v${{ steps.version.outputs.next_version }}
          body: |
            Automated build of Persian language pack for RimWorld.

            **Version:** v${{ steps.version.outputs.next_version }}
            **Build Details:**
            - Commit: ${{ github.sha }}
            - Build ID: ${{ needs.merge-modules.outputs.build-id }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}
            - Python Version: ${{ env.PYTHON_VERSION }}
            - Processing Mode: Parallel (6 modules)

            **Security:**
            - ✅ SLSA Level 3 Provenance
            - ✅ Sigstore Signing
            - ✅ CodeQL Security Analysis
            - ✅ Trivy Vulnerability Scan

            **Performance:**
            - 🚀 Parallel processing across 6 modules
            - ⚡ Optimized build pipeline

            **Files:**
            - `persian-language-${{ needs.merge-modules.outputs.build-id }}.zip` - Main language pack (signed)
            - SHA256 and MD5 checksums included
          files: artifacts/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
