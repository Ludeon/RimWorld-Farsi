name: Persian Translation CI/CD

on:
  push:
    branches: [main, master, beta]
    paths:
      - 'tools/**'
      - 'src/english/**'
      - 'mods/**'
      - 'install.sh'
      - 'install.bat'
      - 'Core/**'
      - 'Royalty/**'
      - 'Ideology/**'
      - 'Biotech/**'
      - 'Anomaly/**'
      - 'Odyssey/**'
      - '.github/workflows/persianCorrectionPythonBeta.yml'
  pull_request:
    branches: [main, master, beta]
    paths:
      - 'tools/**'
      - 'src/english/**'
      - 'mods/**'
      - 'install.sh'
      - 'install.bat'
      - 'Core/**'
      - 'Royalty/**'
      - 'Ideology/**'
      - 'Biotech/**'
      - 'Anomaly/**'
      - 'Odyssey/**'
      - '.github/workflows/persianCorrectionPythonBeta.yml'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to use'
        required: false
        default: '3.13'
        type: choice
        options:
          - '3.11'
          - '3.12'
          - '3.13'
      enable_security_scan:
        description: 'Enable advanced security scanning'
        required: false
        default: true
        type: boolean
      enable_qa:
        description: 'Enable quality assurance (testing and code quality checks)'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Create a GitHub release after successful build'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Mark release as pre-release (beta)'
        required: false
        default: true
        type: boolean
      release_version:
        description: 'Optional SemVer override (e.g. 0.4.0) or auto'
        required: false
        default: 'auto'
        type: string
      enable_performance_benchmark:
        description: 'Run performance benchmarks'
        required: false
        default: false
        type: boolean
      enable_compliance_checks:
        description: 'Run compliance and license scanning'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.13' }}
  UV_CACHE_DIR: ~/.cache/uv
  BUILD_DIR: Data
  TOOLS_DIR: tools/rtl-processor

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write
  checks: write
  id-token: write
  attestations: write

jobs:
  security:
    name: Security & Dependency Analysis
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.enable_security_scan != 'false'
    uses: ./.github/workflows/reusable-security.yml
    with:
      enable_compliance: ${{ github.event.inputs.enable_compliance_checks == 'true' }}

  test:
    name: Quality Assurance
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.enable_qa != 'false'
    uses: ./.github/workflows/reusable-testing.yml
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      enable_benchmarks: ${{ github.event.inputs.enable_performance_benchmark == 'true' }}
      skip_qa: ${{ github.event.inputs.enable_qa == 'false' }}

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    if: needs.test.result != 'skipped'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    outputs:
      module: ${{ matrix.module }}

    strategy:
      matrix:
        module: [Core, Biotech, Ideology, Royalty, Anomaly, Odyssey]
        include:
          - module: Core
            priority: 1
          - module: Biotech
            priority: 2
          - module: Ideology
            priority: 3
          - module: Royalty
            priority: 4
          - module: Anomaly
            priority: 5
          - module: Odyssey
            priority: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Process ${{ matrix.module }} translations
        id: translation
        run: |
          echo "🔄 Processing ${{ matrix.module }} translations..."
          cd ${{ env.TOOLS_DIR }}
          START_TIME=$(date +%s)

          if [ -d "${{ github.workspace }}/${{ matrix.module }}" ]; then
            MODULE_PATH="${{ github.workspace }}/${{ matrix.module }}"
          elif [ -d "${{ github.workspace }}/${{ env.BUILD_DIR }}/${{ matrix.module }}" ]; then
            MODULE_PATH="${{ github.workspace }}/${{ env.BUILD_DIR }}/${{ matrix.module }}"
          else
            MODULE_PATH="${{ github.workspace }}/${{ matrix.module }}"
          fi

          # Robust module existence and size check
          if [ -d "$MODULE_PATH" ]; then
            # Check if module has content
            FILE_COUNT=$(find "$MODULE_PATH" -name "*.xml" | wc -l)
            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "⚠️  Module ${{ matrix.module }} exists but contains no XML files, skipping..."
              echo "translation_duration=0" >> $GITHUB_OUTPUT
              echo "✅ ${{ matrix.module }} module skipped (no XML files)"
              exit 0
            fi

            # Check module size (warn if very large)
            MODULE_SIZE=$(du -sm "$MODULE_PATH" | cut -f1)
            if [ "$MODULE_SIZE" -gt 500 ]; then
              echo "⚠️  Large module detected: ${{ matrix.module }} (${MODULE_SIZE}MB)"
            fi

            echo "📊 Processing $FILE_COUNT XML files in ${{ matrix.module }} module..."

            # Process with error handling
            if python PersianFixer.py "$MODULE_PATH"; then
              END_TIME=$(date +%s)
              DURATION=$((END_TIME - START_TIME))
              echo "translation_duration=$DURATION" >> $GITHUB_OUTPUT
              echo "✅ ${{ matrix.module }} translation processing completed in ${DURATION}s ($FILE_COUNT files)"
            else
              echo "❌ Translation processing failed for ${{ matrix.module }}"
              exit 1
            fi
          else
            echo "ℹ️  Module ${{ matrix.module }} not found, skipping..."
            echo "translation_duration=0" >> $GITHUB_OUTPUT
            echo "✅ ${{ matrix.module }} module skipped (not found)"
          fi

      - name: Validate ${{ matrix.module }} XML structure
        id: validation
        run: |
          echo "🔍 Validating ${{ matrix.module }} XML files..."
          cd ${{ env.TOOLS_DIR }}
          START_TIME=$(date +%s)

          if [ -d "${{ github.workspace }}/${{ matrix.module }}" ]; then
            python validate_xml.py "${{ github.workspace }}/${{ matrix.module }}"
          elif [ -d "${{ github.workspace }}/${{ env.BUILD_DIR }}/${{ matrix.module }}" ]; then
            python validate_xml.py "${{ github.workspace }}/${{ env.BUILD_DIR }}/${{ matrix.module }}"
          fi

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "validation_duration=$DURATION" >> $GITHUB_OUTPUT
          echo "✅ ${{ matrix.module }} XML validation completed in ${DURATION}s"

      - name: Upload module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-processed-${{ github.run_id }}
          path: |
            ${{ matrix.module }}/**
            ${{ env.BUILD_DIR }}/${{ matrix.module }}/**
          retention-days: 1
          if-no-files-found: warn

  merge-modules:
    name: Merge & Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
      version-tag: ${{ steps.version.outputs.tag_name }}
      is-prerelease: ${{ steps.version.outputs.is_prerelease }}
      build-id: ${{ steps.metadata.outputs.build-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify RTL Support mod runtime assets
        run: |
          test -f mods/RTL_Persian_Support/Assemblies/RTL_Persian_Support.dll || { echo "Missing RTL_Persian_Support.dll"; exit 1; }
          test -f mods/RTL_Persian_Support/Assemblies/0Harmony.dll || { echo "Missing 0Harmony.dll"; exit 1; }
          test -f mods/RTL_Persian_Support/Vazirmatn.ttf || { echo "Missing Vazirmatn.ttf"; exit 1; }
          test -f mods/RTL_Persian_Support/IranianSans.ttf || { echo "Missing IranianSans.ttf"; exit 1; }
          test -f mods/RTL_Persian_Support/About/About.xml || { echo "Missing About.xml"; exit 1; }
          bash -n install.sh
          echo "✅ RTL Support mod and installer assets verified"

      - name: Determine release version tag
        id: version
        run: |
          IS_PRE="false"
          if [ "${{ github.ref }}" = "refs/heads/beta" ] || [ "${{ github.event.inputs.is_prerelease }}" = "true" ]; then
            IS_PRE="true"
          fi

          OVERRIDE="${{ github.event.inputs.release_version || 'auto' }}"
          OVERRIDE="${OVERRIDE#v}"

          if [ -n "$OVERRIDE" ] && [ "$OVERRIDE" != "auto" ]; then
            BASE_VER="$OVERRIDE"
          else
            LATEST_STABLE=$(git tag --sort=-version:refname | grep '^v[0-9]\+\.[0-9]\+\.[0-9]\+$' | head -1 | sed 's/^v//')
            if [ -z "$LATEST_STABLE" ]; then
              BASE_VER="0.4.0"
            else
              IFS='.' read -r major minor patch <<< "$LATEST_STABLE"
              if [ "$patch" -ge 999 ]; then
                BASE_VER="${major}.$((minor + 1)).0"
              else
                BASE_VER="${major}.${minor}.$((patch + 1))"
              fi
              BASE_VER=$(printf '%s\n%s\n' "0.4.0" "$BASE_VER" | sort -V | tail -n1)
            fi
          fi

          if [ "$IS_PRE" = "true" ]; then
            N=1
            while git rev-parse "v${BASE_VER}-beta.${N}" >/dev/null 2>&1; do
              N=$((N + 1))
            done
            TAG_NAME="v${BASE_VER}-beta.${N}"
          else
            TAG_NAME="v${BASE_VER}"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRE}" >> $GITHUB_OUTPUT
          echo "Computed version tag: ${TAG_NAME} (prerelease=${IS_PRE})"

      - name: Download all module artifacts
        uses: actions/download-artifact@v4
        with:
          path: modules/
          # Retry logic for race conditions

      - name: Merge modules into final build
        run: |
          echo "🔀 Merging processed modules..."
          mkdir -p ${{ env.BUILD_DIR }}

          # Copy all processed modules
          for module in Core Biotech Ideology Royalty Anomaly Odyssey; do
            if [ -d "modules/${module}-processed-${{ github.run_id }}" ]; then
              mkdir -p "${{ env.BUILD_DIR }}/${module}"
              cp -r "modules/${module}-processed-${{ github.run_id }}"/* "${{ env.BUILD_DIR }}/${module}/"
            fi
          done

          echo "✅ Module merging completed"

      - name: Assemble Essential edition (English Strings/)
        run: |
          echo "🧩 Assembling Essential edition with English Strings/..."
          python tools/translation-tools/build_essential.py \
            --build-dir "${{ env.BUILD_DIR }}" \
            --output-dir "${{ env.BUILD_DIR }}-essential" \
            --english-dir "src/english"
          echo "✅ Essential edition assembled"

      - name: Generate comprehensive build report
        id: metadata
        run: |
          BUILD_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "build-id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          # Calculate total durations from job outputs
          TOTAL_TRANSLATION=0
          TOTAL_VALIDATION=0

          # Create comprehensive reports.txt
          cat > ${{ env.BUILD_DIR }}/reports.txt << 'EOF'
          ========================================
          PERSIAN LANGUAGE PACK BUILD REPORT
          ========================================

          BUILD INFORMATION
          -----------------
          Build ID: ${{ github.run_id }}-${{ github.run_attempt }}
          Commit: ${{ github.sha }}
          Timestamp: $TIMESTAMP
          Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Trigger: ${{ github.event_name }}
          Branch: ${{ github.ref_name }}
          Actor: ${{ github.actor }}
          Run ID: ${{ github.run_id }}
          Run Attempt: ${{ github.run_attempt }}

          CONFIGURATION
          -------------
          Python Version: ${{ env.PYTHON_VERSION }}
          Enable Security Scan: ${{ github.event.inputs.enable_security_scan || 'true' }}
          Enable QA: ${{ github.event.inputs.enable_qa || 'true' }}
          Enable Performance Benchmark: ${{ github.event.inputs.enable_performance_benchmark || 'false' }}
          Enable Compliance Checks: ${{ github.event.inputs.enable_compliance_checks || 'false' }}
          Create Release: ${{ github.event.inputs.create_release || 'false' }}
          Is Pre-release: ${{ github.event.inputs.is_prerelease || 'true' }}

          DEPENDENCIES & TOOLS
          -------------------
          Python Packages (from requirements.txt):
          EOF

          # Add Python dependencies
          if [ -f "${{ env.TOOLS_DIR }}/requirements.txt" ]; then
            echo "Contents of requirements.txt:" >> ${{ env.BUILD_DIR }}/reports.txt
            cat ${{ env.TOOLS_DIR }}/requirements.txt >> ${{ env.BUILD_DIR }}/reports.txt
            echo "" >> ${{ env.BUILD_DIR }}/reports.txt
          fi

          cat >> ${{ env.BUILD_DIR }}/reports.txt << 'EOF'

          GitHub Actions Used:
          - actions/checkout@v4
          - actions/setup-python (custom action)
          - github/codeql-action/init@v3
          - github/codeql-action/autobuild@v3
          - github/codeql-action/analyze@v3
          - actions/dependency-review-action@v4
          - aquasecurity/trivy-action@v0.36.0
          - actions/upload-artifact@v4
          - actions/download-artifact@v4
          - actions/attest-build-provenance@v2
          - sigstore/cosign-installer@v3
          - softprops/action-gh-release@v2
          - codecov/codecov-action@v5

          System Tools:
          - Python ${{ env.PYTHON_VERSION }}
          - pip, uv (package manager)
          - lxml (XML processing)
          - pytest (testing)
          - mypy (type checking)
          - ruff (linting)
          - black (code formatting)
          - isort (import sorting)
          - pip-audit (security audit)
          - pip-licenses (license checking)

          PROCESSING STATISTICS
          --------------------
          Parallel Processing: Enabled
          Modules Processed: Core, Biotech, Ideology, Royalty, Anomaly, Odyssey
          Total Modules: 6

          WORKFLOW EXECUTION SUMMARY
          --------------------------
          Security Job: ${{ needs.security.result || 'not_run' }}
          QA Job: ${{ needs.test.result || 'not_run' }}
          Build Jobs: Parallel execution across 6 modules
          Merge & Package: ${{ job.status }}

          KEY OUTPUTS
          -----------
          - Full Persian language pack ZIP archive (with Persian Strings/)
          - Essential Persian language pack ZIP archive (with English Strings/)
          - SHA256 and MD5 checksums
          - SLSA Level 3 provenance attestation
          - Sigstore cryptographic signatures
          - Comprehensive build report (this file)

          NOTES FOR FUTURE IMPROVEMENTS
          -----------------------------
          - Review any warnings in job logs
          - Check code quality metrics in test results
          - Monitor performance benchmarks if enabled
          - Verify security scan results in Security tab
          - Test language pack in RimWorld for any issues

          ========================================
          END OF REPORT
          ========================================
          EOF

          # Also create the JSON for backward compatibility
          cat > ${{ env.BUILD_DIR }}/build_info.json << EOF
          {
            "build_id": "$BUILD_ID",
            "commit": "${{ github.sha }}",
            "timestamp": "$TIMESTAMP",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "trigger": "${{ github.event_name }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "python_version": "${{ env.PYTHON_VERSION }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "parallel_processing": true,
            "modules_processed": ["Core", "Biotech", "Ideology", "Royalty", "Anomaly", "Odyssey"]
          }
          EOF

      - name: Create OS-labeled distribution packages (Windows & Linux, with Auto-Installers)
        id: artifact
        run: |
          BUILD_ID="${{ steps.metadata.outputs.build-id }}"
          VERSION_TAG="${{ steps.version.outputs.tag_name }}"
          ARTIFACT_NAME="persian-language-${BUILD_ID}"
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

          cp "${{ env.BUILD_DIR }}/reports.txt" "${{ env.BUILD_DIR }}-essential/reports.txt"
          cp "${{ env.BUILD_DIR }}/build_info.json" "${{ env.BUILD_DIR }}-essential/build_info.json"

          python tools/translation-tools/package_release.py \
            --repo-root . \
            --full-build "${{ env.BUILD_DIR }}" \
            --essential-build "${{ env.BUILD_DIR }}-essential" \
            --output-dir release_dist \
            --version-tag "${VERSION_TAG}"

          ls -lh release_dist/

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release_dist/*.zip'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release_dist/
          retention-days: 30
          if-no-files-found: error

      - name: Generate enhanced job summary
        if: always()
        run: |
          echo "# 🚀 Persian Translation Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build ID | ${{ steps.metadata.outputs.build-id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | ${{ steps.metadata.outputs.timestamp }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Version | ${{ env.PYTHON_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Processing Mode | Parallel (6 modules) |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "| Artifacts | [View & Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts) |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Build Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- ✅ Security checks passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Quality assurance completed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Parallel translation processing successful" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ XML validation passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Build artifacts created and attested" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Build failed - review job logs for details" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Automated Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: merge-modules
    if: ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.merge-modules.outputs.artifact-name }}
          path: artifacts/

      - name: Create and push tag
        run: |
          TAG_NAME="${{ needs.merge-modules.outputs.version-tag }}"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists, skipping tag push"
          fi

      - name: Generate release changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | sed -n '2p' || true)
          LOG=$(REPO="${{ github.repository }}" PREV_TAG="$PREV_TAG" python3 - << 'PYEOF'
          import os, re, subprocess

          repo = os.environ["REPO"]
          prev_tag = os.environ.get("PREV_TAG", "").strip()
          rev_range = f"{prev_tag}..HEAD" if prev_tag else "-n 15 HEAD"
          cmd = ["git", "log", "--first-parent", "--no-merges", "--pretty=format:%H%x09%h%x09%s"]
          cmd += [rev_range] if prev_tag else ["-n", "20", "HEAD"]
          out = subprocess.check_output(cmd, text=True, errors="replace")

          noise_re = re.compile(
              r"^(test try|update readme|update .*\.yml|chore\(release\):|fix\(ci\):|ci:)",
              re.IGNORECASE,
          )
          buckets = {
              "✨ Features & Enhancements": [],
              "🐛 Bug Fixes": [],
              "🔧 Translations & Maintenance": [],
          }
          seen = set()
          for line in out.splitlines():
              parts = line.split("\t", 2)
              if len(parts) != 3:
                  continue
              full_sha, short_sha, subj = parts
              subj = subj.strip()
              if not subj or noise_re.match(subj):
                  continue
              norm = re.sub(r"[^a-z0-9]+", " ", subj.lower()).strip()
              if norm in seen:
                  continue
              seen.add(norm)
              entry = f"- {subj} ([{short_sha}](https://github.com/{repo}/commit/{full_sha}))"
              low = subj.lower()
              if low.startswith("feat"):
                  buckets["✨ Features & Enhancements"].append(entry)
              elif low.startswith("fix"):
                  buckets["🐛 Bug Fixes"].append(entry)
              else:
                  buckets["🔧 Translations & Maintenance"].append(entry)

          ordered = (
              buckets["✨ Features & Enhancements"]
              + buckets["🐛 Bug Fixes"]
              + buckets["🔧 Translations & Maintenance"]
          )
          if ordered:
              print("\n".join(ordered[:4]))
          else:
              print("- Translation updates and improvements.")
          PYEOF
          )

          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT
          {
            echo "changes<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts with Sigstore
        run: |
          cd artifacts
          for file in *.zip *.bat *.sh; do
            [ -f "$file" ] || continue
            cosign sign-blob --oidc-issuer https://token.actions.githubusercontent.com --yes "$file" > "$file.sig"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.merge-modules.outputs.version-tag }}
          name: Persian Language Pack ${{ needs.merge-modules.outputs.version-tag }}
          generate_release_notes: false
          body: |
            **Compatibility / سازگاری:** RimWorld 1.6 (`Core`, `Royalty`, `Ideology`, `Biotech`, `Anomaly`, `Odyssey`)

            ### راهنمای سریع نصب (فارسی)
            ۱. اسکریپت **`autoinstall-windows.bat`** (ویندوز) یا **`autoinstall-linux.sh`** (لینوکس / استیم‌دک / مک) را از ردیف اول جدول زیر دانلود و اجرا کنید *(پیشنهادی: دانلود و نصب خودکار)*؛ یا یکی از بسته‌های آفلاین جدول را دریافت نمایید.
            ۲. در منوی نصب گزینه مورد نظر را انتخاب کنید (نسخه همراه با ماد RTL بهترین کیفیت فونت و راست‌به‌چپ را دارد).
            ۳. بازی را اجرا کرده، در بخش **Mods** ماد `RTL Persian Support` را فعال کنید و زبان بازی را روی **Persian (فارسی)** قرار دهید.

            ---

            ### 📝 What's Changed
            ${{ steps.changelog.outputs.changes }}

            ${{ steps.changelog.outputs.prev_tag && format('**Full Changelog**: https://github.com/{0}/compare/{1}...{2}', github.repository, steps.changelog.outputs.prev_tag, needs.merge-modules.outputs.version-tag) || '' }}

            ---
