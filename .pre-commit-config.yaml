repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^tools/.*\.py$
      - id: ruff-format
        files: ^tools/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        files: ^tools/.*\.py$

  - repo: local
    hooks:
      - id: run-persian-tests
        name: Run Persian RTL tests
        entry: python -m pytest tools/rtl-processor/tests/ -v
        language: system
        pass_filenames: false
        files: ^(tools/rtl-processor/.*\.py|tools/rtl-processor/tests/.*\.py)$

  - repo: local
    hooks:
      - id: validate-xml
        name: Validate XML files
        entry: python tools/rtl-processor/validate_xml.py
        language: system
        pass_filenames: false
        files: \.xml$
        exclude: ^(english/|archive/)
